# Refresh the saved weather forecast every 6 hours during the trip, rebuild the page, and redeploy GitHub Pages.
# Runs at 05:17, 11:17, 17:17 and 23:17 JST (GitHub may start scheduled runs a few minutes late).
# Stops doing anything after the last walking day (19 Nov 2026). Run it by hand from the Actions tab: "Refresh weather" → Run workflow.
name: Refresh weather

on:
  schedule:
    - cron: "17 2,8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: weather
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Still before the end of the trip?
        id: when
        run: |
          today=$(TZ=Asia/Tokyo date +%F)
          echo "today=$today"
          if [[ "$today" > "2026-11-19" && "${{ github.event_name }}" == "schedule" ]]; then echo "go=no" >> "$GITHUB_OUTPUT"; else echo "go=yes" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.when.outputs.go == 'yes'

      - uses: actions/setup-python@v5
        if: steps.when.outputs.go == 'yes'
        with:
          python-version: "3.12"

      - name: Install Playwright (reads the days from the planner)
        if: steps.when.outputs.go == 'yes'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Fetch the forecast and rebuild the page
        if: steps.when.outputs.go == 'yes'
        run: |
          python3 tools/build_weather.py
          python3 tools/build_live.py

      - name: Commit and push
        if: steps.when.outputs.go == 'yes'
        id: push
        run: |
          git config user.name "weather-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/weather.json "$RUNNER_TEMP/weather.json"
          when=$(python3 -c "import json; print(json.load(open('data/weather.json'))['updated'])")
          # start from the latest main each try (someone may have pushed meanwhile), put the new forecast in, rebuild, push
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp "$RUNNER_TEMP/weather.json" data/weather.json
            python3 tools/build_weather.py --from-json && python3 tools/build_live.py
            git add data/weather.json src/planner.html index.html
            if git diff --cached --quiet; then echo "pushed=no" >> "$GITHUB_OUTPUT"; exit 0; fi
            git commit -q -m "Weather: scheduled refresh (forecast as of $when)"
            if git push origin HEAD:main; then echo "pushed=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep $((i * 10))
          done
          exit 1

      - name: Redeploy GitHub Pages
        if: steps.push.outputs.pushed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will rebuild from the push on its own"
